name: Benchmark

on:
  push:
    branches: [main]
  # Also on PRs, so a release PR shows the number it will publish before merging.
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,ml]"

      - name: Run benchmark
        run: |
          source .venv/bin/activate
          # Fails on a missing/degraded layer (0.9.1's silent L2 fallback) and if F1
          # drops more than a point below the published figure (83.1% in-sample).
          python tests/benchmark/run_benchmark.py --output benchmark_results.json --min-f1 0.821

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
