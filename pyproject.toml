[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-armor"
version = "0.9.1"
description = "Open-core LLM prompt security analysis — detect prompt injections, jailbreaks, and other attacks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "prompt-armor contributors" }]
keywords = ["llm", "security", "prompt-injection", "jailbreak", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "regex>=2023.0",
    # ML detection layers (L2 DeBERTa-ONNX, L3 FAISS, L5 IsolationForest) ship by
    # default: the fusion meta-classifier is trained expecting them, so without
    # them a base install silently under-scores real attacks (a textbook injection
    # returns ALLOW). They are NOT optional — see tests/unit/test_default_install.py.
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
    "faiss-cpu>=1.7",
    "scikit-learn>=1.3",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
# Back-compat shim: the ML layers used to live here and are now core deps (above),
# so `prompt-armor[ml]` resolves to the same thing as the plain base install.
ml = []
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "ruff>=0.15,<0.16",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]
mcp = [
    "mcp>=1.0",
]
all = [
    "prompt-armor[dev,mcp]",
]

[project.scripts]
prompt-armor = "prompt_armor.cli.main:cli"
prompt-armor-mcp = "prompt_armor.mcp.server:main"

[project.urls]
Homepage = "https://github.com/prompt-armor/prompt-armor"
Repository = "https://github.com/prompt-armor/prompt-armor"
Issues = "https://github.com/prompt-armor/prompt-armor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_armor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Modules with optional deps or third-party types
[[tool.mypy.overrides]]
module = [
    "prompt_armor.layers.l2_classifier",
    "prompt_armor.layers.l3_similarity",
    "prompt_armor.layers.l5_negative_selection",
    "prompt_armor.mcp.*",
    "prompt_armor.cli.*",
    "prompt_armor.council",
]
ignore_errors = true

# Third-party libs without type stubs
[[tool.mypy.overrides]]
module = ["regex", "regex.*"]
ignore_missing_imports = true
